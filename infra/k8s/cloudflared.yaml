# NOTE: this tunnel is token-managed, so the public-hostname → service routes
# live in the Cloudflare Zero Trust dashboard (Networks → Tunnels → Public
# Hostname), NOT in this file. Keep the dashboard in sync with these three:
#
#   hubnegocios.udp.cl        → http://web.hubnegocios.svc.cluster.local:3000
#   api.hubnegocios.udp.cl    → http://api.hubnegocios.svc.cluster.local:4000
#   admin.hubnegocios.udp.cl  → http://admin.hubnegocios.svc.cluster.local:3101  (admin Service, admin.yaml)
#
# The admin route is required for admin.hubnegocios.udp.cl to resolve at all;
# without it the deployment is healthy in-cluster but unreachable from the
# internet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1   # tunnel can tolerate losing one connector
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --protocol=http2
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hubnegocios-secrets
                  key: CLOUDFLARE_TUNNEL_TOKEN
          readinessProbe:
            httpGet:
              path: /ready
              port: 20241
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ready
              port: 20241
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
