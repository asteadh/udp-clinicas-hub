# Informational template only — NOT applied directly. The real
# hubnegocios-secrets Secret is created/recreated at deploy time by
# .github/workflows/deploy.yml from GitHub Actions repository secrets
# (kubectl create secret generic ... --from-literal=...). This file documents
# every key that Secret must contain and is not part of kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: hubnegocios-secrets
type: Opaque
stringData:
  # CNPG bootstrap — must match POSTGRES_USER / POSTGRES_PASSWORD below
  username: "hubnegocios"
  password: "CHANGE_ME"

  POSTGRES_USER: "hubnegocios"
  POSTGRES_DB: "hubnegocios"
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgres://hubnegocios:CHANGE_ME@postgres-rw.hubnegocios.svc.cluster.local:5432/hubnegocios?sslmode=disable"

  JWT_SECRET: "CHANGE_ME"
  STORAGE_SIGNING_SECRET: "CHANGE_ME"

  # Object storage (also MinIO root credentials)
  S3_ACCESS_KEY_ID: "CHANGE_ME"
  S3_SECRET_ACCESS_KEY: "CHANGE_ME"

  # Cloudflare tunnel
  CLOUDFLARE_TUNNEL_TOKEN: "CHANGE_ME"

  # Google OAuth (admin login)
  GOOGLE_CLIENT_ID: "CHANGE_ME"
  GOOGLE_CLIENT_SECRET: "CHANGE_ME"
  GOOGLE_ALLOWED_CLIENT_IDS: "CHANGE_ME"

  # SMTP (only used when MAIL_PROVIDER=smtp in configmap.yaml / production.env)
  SMTP_USERNAME: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"

  # Admin bootstrap
  HUBNEGOCIOS_SUPERADMIN_EMAILS: "CHANGE_ME"
  HUBNEGOCIOS_ADMIN_SEED_PASSWORD: "CHANGE_ME"
